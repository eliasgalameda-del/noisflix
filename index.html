<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Noisflix</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="App particular e pessoal de um casal para assistir aos próprios vídeos e fotos.">
<meta name="apple-mobile-web-app-title" content="Noisflix">
<meta name="application-name" content="Noisflix">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff}
body{font-family:"Helvetica Neue",Helvetica,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit}
img,svg,video{display:block}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:#000;overflow-x:hidden}
.ic{width:24px;height:24px}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}

/* ---------- marca ---------- */
.markL{font-family:"Bebas Neue",Impact,sans-serif;color:#e50914;line-height:.8;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.wordmark{font-family:"Bebas Neue",Impact,sans-serif;color:#e50914;letter-spacing:.02em;line-height:1}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;background:#000;z-index:300;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.stripes{position:absolute;inset:-5% 0;display:flex;filter:blur(1.2px) saturate(1.3)}
.stripes i{opacity:0;transform:scaleY(.15);animation:stripe 2.8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes stripe{0%{opacity:0;transform:scaleY(.15)}22%{opacity:1;transform:scaleY(1)}70%{opacity:.95;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1.2) scaleX(.2)}}
.splash .smark{position:relative;animation:markin 2.8s ease forwards;filter:drop-shadow(0 10px 30px rgba(0,0,0,.7))}
@keyframes markin{0%{transform:scale(.5);opacity:0}22%{opacity:1;transform:scale(1)}75%{transform:scale(1.06);opacity:1}100%{transform:scale(4);opacity:0}}

/* ---------- perfis ---------- */
.prof{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--pc,#1d2b31)}
.prof-hero{position:relative;flex:1;min-height:56vh;background:#111 center top/cover no-repeat}
.prof-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,transparent 30%,transparent 55%,var(--pc,#1d2b31) 100%)}
.prof-empty{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a0a0e,#000 70%)}
.prof-line{position:absolute;bottom:10px;left:0;right:0;text-align:center;z-index:2;font-weight:700;font-size:20px;display:flex;gap:10px;justify-content:center;align-items:center;padding:0 16px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.prof-panel{position:relative;padding:26px 16px calc(36px + env(safe-area-inset-bottom));text-align:center;z-index:1}
.prof-panel::before{content:"";position:absolute;left:-30%;right:-30%;top:72px;bottom:0;border-radius:50% 50% 0 0/60px 60px 0 0;background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.12));z-index:-1}
.prof-q{font-size:20px;color:rgba(255,255,255,.75);margin-bottom:18px}
.prof-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 26px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:10px;width:96px}
.pav{width:96px;height:96px;border-radius:9px;overflow:hidden;position:relative}
.pav .av,.pav img{width:100%;height:100%}
.pedit{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center}
.pedit svg{width:34px;height:34px}
.pname{font-size:19px;font-weight:700;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-actions{display:flex;justify-content:center;gap:56px;margin-top:22px}
.pact{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:18px;color:rgba(255,255,255,.85)}
.pbox{width:96px;height:96px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pbox svg{width:34px;height:34px}
.av{display:block;width:100%;height:100%;object-fit:cover}
.avc{display:grid;place-items:center;width:100%;height:100%}
.avc svg{width:100%;height:100%}

/* ---------- topo / chips ---------- */
.home-bg{position:absolute;left:0;right:0;top:0;height:1000px;background:linear-gradient(to bottom,var(--hc,#16242b) 0%,#000 80%);transition:background .6s;z-index:0;pointer-events:none}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;transition:background .25s}
.topbar.solid{background:rgba(0,0,0,.94)}
.topbar h1{font-size:29px;font-weight:500;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{position:relative;width:34px;height:34px;display:grid;place-items:center}
.tb-btn svg{width:28px;height:28px}
.tb-badge{position:absolute;top:-8px;right:-9px;background:#e50914;font-size:13px;font-weight:700;border-radius:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:9px;padding:4px 16px 16px;overflow-x:auto;position:relative;z-index:2}
.chip{flex:none;padding:10px 20px;border:1px solid rgba(255,255,255,.3);border-radius:11px;background:rgba(255,255,255,.08);font-size:17px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip.x{padding:10px 11px}
.chip svg{width:18px;height:18px}

/* ---------- hero ---------- */
.hero{position:relative;margin:0 24px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.25);box-shadow:0 14px 50px rgba(0,0,0,.6);aspect-ratio:.67;background:#1a1a1a;z-index:1}
.hero>img,.hero>.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.88))}
.hero .hc{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 22px;display:flex;flex-direction:column;gap:12px}
.hero-line{text-align:center;font-size:19px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:4px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:5px;font-size:19px;font-weight:600;width:100%}
.btn svg{width:26px;height:26px}
.btn-w{background:#fff;color:#000}
.btn-g{background:rgba(110,110,110,.55);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn-d{background:#2a2a2a;color:#fff}
.t10{background:#e50914;color:#fff;font-weight:900;width:28px;height:30px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-radius:2px;line-height:.95;flex:none;font-family:Arial,sans-serif}
.t10 b:first-child{font-size:8px;letter-spacing:.03em}.t10 b:last-child{font-size:14px}
.t10.sm{width:21px;height:23px}.t10.sm b:first-child{font-size:6px}.t10.sm b:last-child{font-size:11px}

/* ---------- linhas ---------- */
.row{margin-top:26px;position:relative;z-index:1}
.row h2{font-size:21px;font-weight:700;margin:0 16px 10px}
.rail{display:flex;gap:9px;overflow-x:auto;padding:0 16px;scroll-padding:0 16px}
.card{flex:none;width:calc((100% - 18px)/3.2);max-width:165px;position:relative;border-radius:6px;overflow:hidden;background:#1c1c1c;display:block}
.pimg{width:100%;aspect-ratio:.71;object-fit:cover;background:#222}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:linear-gradient(160deg,#3b0b10,#141414 70%);font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;line-height:1;color:#fff;word-break:break-word}
.bdg{position:absolute;left:50%;transform:translateX(-50%);bottom:0;display:flex;flex-direction:column;align-items:stretch;font-size:12.5px;font-weight:700;white-space:nowrap;z-index:2;text-align:center}
.bdg span{padding:3px 9px;background:#e50914;color:#fff;border-radius:2px 2px 0 0}
.bdg span+span{background:#fff;color:#000;border-radius:0}
.c10{position:absolute;top:0;right:0;z-index:2}
.cw{background:#1c1c1c}
.cw-top{position:relative;display:block;width:100%}
.pcirc{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);width:58px;height:58px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.4);display:grid;place-items:center}
.pcirc svg{width:24px;height:24px;margin-left:3px}
.cwbar{height:4px;background:#5a5a5a;margin:10px 9px 8px;border-radius:2px;overflow:hidden}
.cwbar i,.bar i,.dprog i,.pbar i{display:block;height:100%;background:#e50914}
.cwfoot{display:flex;align-items:center;justify-content:space-around;padding:2px 0 8px}
.cwfoot button{padding:4px 10px}
.cwfoot button svg{width:30px;height:30px}
.cwfoot span{width:1px;height:26px;background:#555}
.t10c{flex:none;display:flex;align-items:flex-end;width:calc((100% - 18px)/2.15);max-width:220px}
.t10n{font-family:"Bebas Neue",Impact,sans-serif;font-size:150px;line-height:.7;color:#000;-webkit-text-stroke:3px #8a8a8a;margin-right:-12px;letter-spacing:-.06em}
.t10c .pimg{width:62%;border-radius:5px;position:relative;z-index:1;flex:none}
.empty{position:relative;z-index:1;margin:40px 24px;padding:32px 22px;border:1px dashed #444;border-radius:14px;text-align:center;color:#bbb;line-height:1.5}
.empty h3{color:#fff;font-size:22px;margin:12px 0 6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px}
.grid3 .card{width:auto;max-width:none}

/* ---------- navegação inferior ---------- */
.bnav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:490px;background:rgba(36,36,36,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:44px;display:flex;padding:6px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 7px;border-radius:36px;color:#b5b5b5;font-size:12.5px;white-space:nowrap;min-width:0}
.bnav button.on{background:rgba(255,255,255,.1);color:#fff}
.bnav svg{width:27px;height:27px}
.bnav .nav-av{width:27px;height:27px;border-radius:5px;overflow:hidden}
.screen{position:relative;min-height:100vh;min-height:100dvh;padding-bottom:120px}

/* ---------- detalhe ---------- */
.dhead{position:sticky;top:0;z-index:30;background:#000;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px;display:flex;align-items:center;gap:12px}
.dhead svg{width:28px;height:28px}
.dhead h2{margin:0;font-size:20px;font-weight:600;flex:1}
.dmedia{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden}
.dmedia video,.dmedia img{width:100%;height:100%;object-fit:cover}
.roundbtn{position:absolute;right:12px;bottom:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center}
.roundbtn svg{width:20px;height:20px}
.dprog{height:3px;background:#444}
.dbody{padding:12px 16px 0}
.dtitle{font-size:33px;font-weight:800;margin:0 0 10px;line-height:1.1}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:12px;color:#bcbcbc;font-size:19px;margin-bottom:14px}
.rate{font-size:12px;font-weight:800;padding:3px 4px;border-radius:3px;min-width:26px;text-align:center;line-height:1.2;font-family:Arial,sans-serif}
.hd{border:1.5px solid #bcbcbc;border-radius:3px;font-size:10px;font-weight:800;padding:1px 4px;line-height:1.3}
.dbody .btn{margin-bottom:12px}
.epline{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:18px 0 6px}
.eprog{display:flex;align-items:center;gap:16px;color:#bcbcbc;font-size:16px}
.bar{flex:1;height:3px;background:#555}
.eprog span{text-align:center;width:110px}
.syn{font-size:18px;line-height:1.42;margin:16px 0 10px;white-space:pre-line}
.cast{color:#bcbcbc;font-size:15.5px;line-height:1.4;margin-bottom:4px;cursor:pointer}
.cast b{color:#9c9c9c;font-weight:700}
.cast.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;justify-content:space-around;padding:26px 4px 18px}
.act{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:14.5px;color:#bcbcbc;flex:1;text-align:center;line-height:1.3}
.act svg{width:32px;height:32px;color:#fff}
.flip{transform:rotate(180deg)}
.tabs{display:flex;gap:40px;padding:0 16px;border-top:3px solid #333;position:relative}
.tab{padding:18px 0 14px;font-size:18.5px;font-weight:700;color:#bcbcbc;position:relative}
.tab.on{color:#fff}
.tab.on::before{content:"";position:absolute;top:-3px;left:-20px;right:-20px;height:5px;background:#e50914}
.srow{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 8px 12px}
.ssel{display:inline-flex;align-items:center;gap:14px;background:#262626;padding:11px 18px;border-radius:4px;font-size:20px;font-weight:700}
.ssel svg{width:18px;height:18px}
.ep{padding:8px 16px 22px}
.ep-top{display:flex;gap:16px;align-items:center}
.ep-th{position:relative;width:42%;max-width:220px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#222;flex:none}
.ep-th img{width:100%;height:100%;object-fit:cover}
.ep-th .pc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:grid;place-items:center}
.ep-th .pc svg{width:17px;height:17px;margin-left:2px}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#555}
.ep-t{flex:1;font-size:18px;font-weight:700;line-height:1.35;min-width:0}
.ep-t small{display:block;color:#bcbcbc;font-weight:400;font-size:16px;margin-top:2px}
.ep-dl svg{width:30px;height:30px}
.ep-syn{color:#d2d2d2;font-size:17px;line-height:1.42;margin-top:14px}
.simgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 8px}
.simgrid .card{width:auto;max-width:none}
.trl{margin:8px 16px}
.trl .tth{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#222}
.trl .tth img{width:100%;height:100%;object-fit:cover}
.trl h4{margin:10px 0 0;font-size:17px}

/* ---------- sheets / overlays ---------- */
.ov .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:140;opacity:0;transition:opacity .25s}
.ov .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:520px;background:#2b2b2b;border-radius:14px 14px 0 0;z-index:141;transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
.ov.open .sheet-bg{opacity:1}
.ov.open .sheet{transform:translate(-50%,0)}
.picker{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;gap:26px;overflow:auto;padding:80px 20px 150px;opacity:0;transition:opacity .2s}
.ov.open .picker{opacity:1}
.picker .po{font-size:19px;color:#a8a8a8;text-align:center}
.picker .po.on{color:#fff;font-weight:700;font-size:23px}
.picker .pclose{position:fixed;bottom:calc(40px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.picker .pclose svg{width:28px;height:28px}
.sh-title{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh-title h3{margin:0;flex:1;font-size:20px}
.xbtn{width:32px;height:32px;border-radius:50%;background:#444;display:grid;place-items:center;flex:none}
.xbtn svg{width:18px;height:18px}
.sh-opt{display:flex;align-items:center;gap:16px;width:100%;padding:15px 4px;font-size:17px;border-bottom:1px solid #3a3a3a}
.sh-opt:last-child{border-bottom:0}
.sh-opt svg{width:24px;height:24px;flex:none}
.sh-opt.danger{color:#ff6b6b}
.ish{display:flex;gap:14px}
.ish img,.ish .ph{width:105px;aspect-ratio:.71;border-radius:5px;object-fit:cover;flex:none}
.ish h3{margin:2px 0 6px;font-size:21px}
.ish .meta{font-size:14px;margin-bottom:8px;gap:8px}
.ish p{margin:0;font-size:15px;line-height:1.4;color:#ddd;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ish-acts{display:flex;justify-content:space-around;margin:20px 0 6px}
.ish-acts .act{font-size:13px}
.ish-acts .act .circ{width:48px;height:48px;border-radius:50%;background:#444;display:grid;place-items:center}
.ish-acts .act .circ.w{background:#fff;color:#000}
.ish-acts .act .circ svg{width:24px;height:24px;color:inherit}
.ish-more{display:flex;align-items:center;gap:10px;width:100%;padding:16px 4px 4px;border-top:1px solid #444;margin-top:14px;font-size:16px;font-weight:600}
.ish-more svg{width:22px;height:22px}
.ish-more .grow{flex:1}
.rates{display:flex;justify-content:space-around;padding:20px 0 8px}
.rates button{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px;color:#ccc}
.rates .circ{width:66px;height:66px;border-radius:50%;background:#444;display:grid;place-items:center}
.rates .on .circ{background:#fff;color:#000}
.rates svg{width:30px;height:30px}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#fff;color:#000;padding:12px 18px;border-radius:8px;font-weight:600;font-size:15px;z-index:400;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-weight:600}
#loading.show{display:flex}
.spin{width:54px;height:54px;border:5px solid rgba(255,255,255,.2);border-top-color:#e50914;border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- player ---------- */
.player{position:fixed;inset:0;background:#000;z-index:120;user-select:none}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pnov{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;padding:30px;text-align:center}
.pctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.7),transparent 25%,transparent 65%,rgba(0,0,0,.8));transition:opacity .3s}
.pctl.hid{opacity:0}
.pctl.hid *{pointer-events:none}
.ptop{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px}
.ptop svg{width:28px;height:28px}
.ptitle{flex:1;text-align:center;font-weight:600;font-size:16px;padding-right:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmid{display:flex;justify-content:center;align-items:center;gap:60px}
.pmid button svg{width:46px;height:46px}
.pmid .pp svg{width:66px;height:66px}
.pbot{padding:0 18px calc(22px + env(safe-area-inset-bottom))}
.seek{display:flex;align-items:center;gap:14px;font-size:14px}
.seek input{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,#e50914 var(--p,0%),rgba(255,255,255,.35) var(--p,0%));outline:none}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#e50914}
.seek input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#e50914;border:0}
.pbtns{display:flex;justify-content:center;gap:34px;margin-top:16px;font-size:15px;font-weight:600}

/* ---------------- Banco local (IndexedDB) ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('nossaflix', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('media'); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out;
      const req = fn(s); if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Sem espaço de armazenamento'));
    });
  },
  get(st, k) { return this.tx(st, 'readonly', s => s.get(k)); },
  put(st, k, v) { return this.tx(st, 'readwrite', s => s.put(v, k)); },
  del(st, k) { return this.tx(st, 'readwrite', s => s.delete(k)); },
  keys(st) { return this.tx(st, 'readonly', s => s.getAllKeys()); },
  all(st) { return this.tx(st, 'readonly', s => s.getAll()); },
  clear(st) { return this.tx(st, 'readwrite', s => s.clear()); }
};

/* ---------------- Mídia na nuvem (Supabase Storage) ---------------- */
const mediaURLs = {};
const mu = id => (id && mediaURLs[id]) || '';

const mediaSize = id => (S.media[id] && S.media[id].size) || 0;
async function signAll() {
  const ids = Object.keys(S.media).filter(id => !mediaURLs[id]);
  for (let i = 0; i < ids.length; i += 500) {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(ids.slice(i, i + 500), 60 * 60 * 24 * 7);
    if (error) throw error;
    (data || []).forEach(d => { if (d.signedUrl) mediaURLs[d.path] = d.signedUrl; });
  }
}
async function uploadFile(id, blob, onProg) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('sessão expirada, entre de novo');
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${id}`);
    x.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    x.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    x.setRequestHeader('x-upsert', 'true');
    x.setRequestHeader('cache-control', 'max-age=31536000');
    x.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable && onProg) onProg(e.loaded / e.total); };
    x.onload = () => {
      if (x.status < 300) return res();
      let msg = 'erro ' + x.status; try { const j = JSON.parse(x.responseText); msg = j.message || j.error || msg; } catch (e) {}
      if (x.status === 413 || /maximum allowed size|too large/i.test(msg)) msg = `arquivo maior que o limite do Supabase (${MAX_UPLOAD_MB} MB)`;
      rej(new Error(msg));
    };
    x.onerror = () => rej(new Error('falha de conexão'));
    x.send(blob);
  });
}
function checkSize(blob) {
  if (blob.size > MAX_UPLOAD_MB * 1048576) throw new Error(`o arquivo tem ${(blob.size / 1048576).toFixed(0)} MB e o limite por arquivo é ${MAX_UPLOAD_MB} MB. Comprima o vídeo (ex.: 720p) e tente de novo`);
}
async function putMedia(blob, label, id) {
  checkSize(blob); id = id || 'm_' + uid();
  await uploadFile(id, blob, p => label && loading(true, `${label} ${Math.round(p * 100)}%`));
  S.media[id] = { type: blob.type || '', size: blob.size, at: Date.now() };
  mediaURLs[id] = URL.createObjectURL(blob); return id;
}
async function deleteMedia(id) {
  if (!id) return;
  try { await sb.storage.from(BUCKET).remove([id]); } catch (e) {}
  if (mediaURLs[id] && mediaURLs[id].startsWith('blob:')) URL.revokeObjectURL(mediaURLs[id]);
  delete mediaURLs[id]; delete S.media[id];
}

/* ---------------- Progresso / continuar assistindo ---------------- */
function resume(it) {
  const p = user().progress;
  if (it.type !== 'series') { const pr = p[it.id]; const started = !!pr && pr.t > 3 && pr.d && pr.t / pr.d < 0.95; return { ep: null, pr: pr || null, started, finished: !!pr && pr.d && pr.t / pr.d >= 0.95, at: pr ? pr.at : 0 }; }
  const eps = allEps(it); if (!eps.length) return { ep: null, started: false };
  let last = null;
  for (const e of eps) { const pr = p[e.ep.id]; if (pr && (!last || pr.at > last.pr.at)) last = { ...e, pr }; }
  if (!last) return { ...eps[0], pr: null, started: false, at: 0 };
  const at = last.pr.at;
  if (last.pr.d && last.pr.t / last.pr.d >= 0.95) {
    const idx = eps.findIndex(x => x.ep.id === last.ep.id); const nx = eps[idx + 1];
    if (nx) return { ...nx, pr: p[nx.ep.id] || null, started: true, at };
    return { ...last, started: true, finished: true, at };
  }
  return { ...last, started: true, at };
}

  const u = user();

/* ---------------- Roteador ---------------- */
let stack = [];
let cleanups = [];
function render() {
  cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = [];
  const top = stack[stack.length - 1]; const scr = SCREENS[top.name];
  app.innerHTML = scr.html(top.params || {}) + (scr.nav ? navHTML(scr.nav) : '');
  if (scr.mount) scr.mount(top.params || {});
  window.scrollTo(0, top.scroll || 0);
  if (top.name !== 'player' && document.fullscreenElement) { document.exitFullscreen().catch(() => {}); try { screen.orientation.unlock(); } catch (e) {} }
}
function refresh() { const t = stack[stack.length - 1]; t.scroll = window.scrollY; render(); }
function go(name, params = {}, replace = false) {
  const top = stack[stack.length - 1];
  if (replace) { stack[stack.length - 1] = { name, params }; }
  else { if (top) top.scroll = window.scrollY; stack.push({ name, params }); history.pushState({ d: stack.length }, ''); }
  render();
}
function setRoot(name, params = {}) { stack = [{ name, params }]; render(); }
function back() { history.back(); }
let overlay = null, afterClose = null;

});

  document.body.appendChild(w); overlay = w; history.pushState({ ov: 1 }, '');

    const box = document.getElementById('clips'); if (!box) return;
    const io = new IntersectionObserver(es => es.forEach(en => { const v = en.target.querySelector('video'); if (!v) return; if (en.isIntersecting) { v.muted = clipMuted; v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); } else v.pause(); }), { root: box, threshold: .6 });

  }
};

/* =====================================================================
   Mídia: redimensionar foto / ler vídeo
   ===================================================================== */
async function resizeImage(file, max = 1600) {
  if (/gif|svg/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);

async function importInto(state, entries) {

  const skipped = [];

    const media = {};
    for (let i = 0; i < entries.length; i++) {
      const en = entries[i];
      loading(true, `Enviando arquivo ${i + 1} de ${entries.length}…`);
      const blob = await en.get();
      if (!blob) continue;
      if (blob.size > MAX_UPLOAD_MB * 1048576) { skipped.push(en.id); continue; }
      await uploadFile(en.id, blob, p => loading(true, `Enviando arquivo ${i + 1} de ${entries.length}… ${Math.round(p * 100)}%`));
      media[en.id] = { type: blob.type || '', size: blob.size, at: Date.now() };
    }
    loading(true, 'Salvando…');
    S.settings = Object.assign({ brand: 'NOISFLIX', pin: '', heroId: '' }, state.settings || {});
    S.profiles = state.profiles || []; S.items = state.items || []; S.notifications = state.notifications || [];
    S.media = Object.assign({}, S.media, media); S.users = state.users || {};

    location.reload();
  } catch (e) { loading(false); alert('Erro ao importar: ' + e.message); }
}
async function importBackup(file) {
  try {
    const hl = new DataView(await file.slice(0, 4).arrayBuffer()).getUint32(0);
    const header = JSON.parse(await file.slice(4, 4 + hl).text());
    if (header.app !== 'nossaflix') throw new Error('arquivo inválido');
    let off = 4 + hl;
    const entries = header.media.map(m => { const start = off; off += m.size; return { id: m.id, get: async () => new Blob([await file.slice(start, start + m.size).arrayBuffer()], { type: m.type }) }; });

}

    if (isNew) S.profiles.push(d); else { const i = S.profiles.findIndex(p => p.id === d.id); const old = S.profiles[i]; if (old.photoId && old.photoId !== d.photoId) deleteMedia(old.photoId); S.profiles[i] = d; }
    profNewPhoto = null; await saveState(); closeOv(() => refresh());
  },
  async profDelete() {
    if (!confirm('Excluir este perfil? O histórico dele será apagado.')) return;
    const d = profDraft; const old = S.profiles.find(p => p.id === d.id); if (old && old.photoId) deleteMedia(old.photoId); if (profNewPhoto) deleteMedia(profNewPhoto);
    S.profiles = S.profiles.filter(p => p.id !== d.id); delete S.users[d.id]; if (cur === d.id) cur = null;
    sb.from('kv').delete().eq('key', 'user:' + d.id).then(() => {});
    await saveState(); closeOv(() => refresh());
  },
  tab(d) { if (d.t === 'my' && !cur) return; setRoot(d.t); },
  chip(d) { const t = stack[stack.length - 1]; t.params = { filter: d.f }; t.scroll = 0; render(); },
  chipCats() {
    const cs = allCategories(); if (!cs.length) { toast('Nenhuma categoria cadastrada ainda'); return; }
    const curF = (stack[stack.length - 1].params.filter || '');
    openPicker([{ v: '', label: 'Início' }, { v: 'series', label: 'Séries' }, { v: 'movie', label: 'Filmes' }, { v: 'list', label: 'Minha lista' }, ...cs.map(c => ({ v: 'cat:' + c, label: c }))], curF, v => { const t = stack[stack.length - 1]; t.params = { filter: v }; t.scroll = 0; render(); });
  },
  pickOpt(d) { const cb = pickerCb; pickerCb = null; closeOv(() => cb && cb(d.v)); },
  open(d) { const f = () => go('detail', { id: d.id }); overlay ? closeOv(f) : f(); },
  play(d, el, ev) {
    if (ev) ev.stopPropagation();
    const it = item(d.id); if (!it) return;
    let ep = d.ep || '';
    if (it.type === 'series' && !ep) { const r = resume(it); if (!r.ep) { toast('Esta série ainda não tem episódios'); return; } ep = r.ep.id; }
    const f = () => go('player', { id: it.id, ep }); overlay ? closeOv(f) : f();
  },
  playTrailer(d) { go('player', { id: d.id, trailer: 1 }); },
  info(d) { openInfoSheet(d.id); },
  more(d) { openMoreSheet(d.id); },
  hideCW(d) { user().hidden[d.id] = Date.now(); saveSoon(); closeOv(() => refresh()); toast('Removido de Continuar assistindo'); },
  toggleList(d) {
    const u = user(); const on = u.myList.includes(d.id);
    u.myList = on ? u.myList.filter(x => x !== d.id) : [d.id, ...u.myList]; saveSoon();
    toast(on ? 'Removido da Minha lista' : 'Adicionado à Minha lista ✓'); updateToggles(d.id);
  },
  rate(d) { const f = () => openRateSheet(d.id); overlay ? closeOv(f) : f(); },
  setRate(d) {
    const u = user(); const v = Number(d.v); if (u.ratings[d.id] === v) delete u.ratings[d.id]; else u.ratings[d.id] = v; saveSoon();
    closeOv(() => updateToggles(d.id)); toast(v === 2 ? 'Amei! ❤' : v === 1 ? 'Obrigado pela avaliação' : 'Ok, anotado');
  },
  async share(d) {
    const it = item(d.id); const text = `Vem assistir “${it.title}” comigo no ${brandTitle()} ❤`;
    try { if (navigator.share) await navigator.share({ title: it.title, text }); else { await navigator.clipboard.writeText(text); toast('Texto copiado!'); } } catch (e) {}
  },
  dl(d) {
    const it = item(d.id); if (!it) return; let ep = null;
    if (it.type === 'series') { const e = d.ep ? findEp(it, d.ep) : (resume(it).ep ? findEp(it, resume(it).ep.id) : null); if (!e) { toast('Sem episódios para baixar'); return; } ep = e.ep; }
    const f = () => { if (downloadVideo(it, ep)) toast('Download iniciado'); }; overlay ? closeOv(f) : f();
  },
  dlSeason(d) {
    const it = item(d.id); const t = stack[stack.length - 1]; const si = t.params.si ?? (resume(it).si || 0); const s = it.seasons[si];
    if (!s || !s.episodes.length) { toast('Temporada sem episódios'); return; }
    const eps = s.episodes.filter(e => hasMedia(e.videoId)); if (!eps.length) { toast('Nenhum episódio com vídeo'); return; }
    eps.forEach((e, i) => setTimeout(() => downloadVideo(it, e), i * 900)); toast(`Baixando ${eps.length} episódio(s)…`);
  },
  rmDl(d) { const u = user(); u.downloads = u.downloads.filter(x => x.key !== d.k); saveSoon(); refresh(); },
  dtab(d) { const t = stack[stack.length - 1]; t.params.tab = d.t; refreshDetail(); },
  seasonPick(d) {
    const it = item(d.id); const t = stack[stack.length - 1]; const curSi = t.params.si ?? (resume(it).si || 0);
    openPicker(it.seasons.map((s, i) => ({ v: i, label: s.name || 'Temporada ' + (i + 1) })), curSi, v => { t.params.si = Number(v); t.params.tab = 'eps'; refreshDetail(); });
  },
  seasonInfo(d) { const s = item(d.id).seasons[d.si]; openOverlay(`<div class="sh-title"><h3>${esc(s.name)}</h3><button class="xbtn" data-a="closeOv">${I.x}</button></div><p style="line-height:1.5;color:#ddd;white-space:pre-line">${esc(s.desc)}</p>`); },
  dmute(d, el) { const v = document.getElementById('dvid'); if (!v) return; detailMuted = !detailMuted; v.muted = detailMuted; el.innerHTML = detailMuted ? I.mute : I.sound; },
  clipMute() { clipMuted = !clipMuted; document.querySelectorAll('#clips video').forEach(v => v.muted = clipMuted); const b = document.getElementById('cmute'); if (b) b.innerHTML = clipMuted ? I.mute : I.sound; toast(clipMuted ? 'Som desligado' : 'Som ligado'); },
  expand(d, el) { el.classList.toggle('clamp'); },
  notifs() { go('notifs'); },
  downloads() { go('downloads'); },
  notifOpen(d) { if (item(d.id)) go('detail', { id: d.id }); },
  qclear() { const t = stack[stack.length - 1]; t.params.q = ''; render(); },
  switchProfile() {
    openOverlay(`<div class="sh-title"><h3>Trocar perfil</h3><button class="xbtn" data-a="closeOv">${I.x}</button></div>
      ${S.profiles.map(p => `<button class="sh-opt" data-a="switchTo" data-id="${p.id}"><span style="width:40px;height:40px;border-radius:6px;overflow:hidden;flex:none">${avatarHTML(p)}</span>${esc(p.name)}${p.id === cur ? ' ✓' : ''}</button>`).join('')}
      <button class="sh-opt" data-a="manageProfiles">${I.pencil} Gerenciar perfis</button>`);
  },
  switchTo(d) { closeOv(() => { cur = d.id; ensureUser(cur); setRoot('home'); }); },
  manageProfiles() { closeOv(() => setRoot('profiles', { edit: true })); },
  myMenu() {
    openOverlay(`<div class="sh-title"><h3>Menu</h3><button class="xbtn" data-a="closeOv">${I.x}</button></div>
      <button class="sh-opt" data-a="studio">${I.pencil} Estúdio do Autor</button>
      <button class="sh-opt" data-a="manageProfiles">${I.user} Gerenciar perfis</button>
      <button class="sh-opt" data-a="notifs">${I.bell} Notificações</button>
      <button class="sh-opt" data-a="downloads">${I.download} Downloads</button>
      <button class="sh-opt" data-a="leave">${I.user} Trocar de perfil</button>
      <button class="sh-opt danger" data-a="logout">${I.logout} Sair da conta</button>`);
  },
  leave() { closeOv(() => setRoot('profiles')); },
  studio() {
    const f = () => { if (S.settings.pin) openPinSheet(() => go('studio')); else go('studio'); };
    overlay ? closeOv(f) : f();
  },
  pinOk() { const v = document.getElementById('pinInput').value; if (v === S.settings.pin) { const t = pinThen; pinThen = null; closeOv(t); } else toast('PIN incorreto'); },
  newItem(d) { draftOrig = null; draft = newItemObj(d.t); draftNew = []; draftOld = []; draftSaved = false; go('edit'); },
  editItem(d) { draftOrig = item(d.id); draft = structuredClone(draftOrig); draftNew = []; draftOld = []; draftSaved = false; go('edit'); },
  async delItem(d) {
    const it = item(d.id); if (!confirm(`Excluir “${it.title}”? Isso apaga fotos e vídeos dele.`)) return;
    mediaIdsOf(it).forEach(deleteMedia); S.items = S.items.filter(i => i.id !== d.id);
    Object.values(S.users).forEach(u => { u.myList = u.myList.filter(x => x !== d.id); delete u.ratings[d.id]; u.downloads = u.downloads.filter(x => x.itemId !== d.id); });
    S.notifications = S.notifications.filter(n => n.itemId !== d.id); if (S.settings.heroId === d.id) S.settings.heroId = '';
    await saveState(); refresh(); toast('Título excluído');
  },
  editType(d) { draft.type = d.t; if (d.t === 'series' && !draft.seasons.length) draft.seasons = [newSeason(1)]; document.querySelector('.dhead h2').textContent = `${draftOrig ? 'Editar' : 'Novo'} ${d.t === 'series' ? 'série' : 'filme'}`; renderEditBody(); },
  addCat(d) { const l = splitList(draft.categories); l.push(d.c); draft.categories = l.join(', '); renderEditBody(); },
  addSeason() { draft.seasons.push(newSeason(draft.seasons.length + 1)); renderEditBody(); },
  rmSeason(d) { const s = draft.seasons[d.si]; if (s.episodes.length && !confirm('Excluir esta temporada e todos os episódios dela?')) return; mediaIdsOf(s).forEach(releaseMedia); draft.seasons.splice(d.si, 1); renderEditBody(); },
  addEp(d) { const s = draft.seasons[d.si]; const n = s.episodes.length ? Math.max(...s.episodes.map(e => Number(e.number) || 0)) + 1 : 1; s.episodes.push(newEp(n)); renderEditBody(); },
  rmEp(d) { if (!confirm('Excluir este episódio?')) return; const e = draft.seasons[d.si].episodes[d.ei]; mediaIdsOf(e).forEach(releaseMedia); draft.seasons[d.si].episodes.splice(d.ei, 1); renderEditBody(); },
  rmMedia(d) { setMedia(d.path, ''); if (d.path.endsWith('videoId')) { const pre = d.path.includes('.') ? d.path.slice(0, d.path.lastIndexOf('.') + 1) : ''; setPath(draft, pre + 'duration', 0); } renderEditBody(); },
  async saveEdit() {
    const d = draft; d.title = String(d.title || '').trim(); if (!d.title) { toast('O título é obrigatório'); window.scrollTo(0, 0); return; }
    if (d.type === 'movie') { d.seasons.forEach(s => mediaIdsOf(s).forEach(releaseMedia)); d.seasons = []; } else { d.videoId && releaseMedia(d.videoId); d.videoId = ''; }
    d.top10 = Number(d.top10) || 0;
    if (!draftOrig) { notify(d.id, d.title, d.type === 'series' ? 'Nova série disponível. Assista agora!' : 'Novo filme disponível. Assista agora!'); S.items.push(d); }
    else {
      const oldEps = new Set(allEps(draftOrig).map(e => e.ep.id));
      const added = allEps(d).filter(e => !oldEps.has(e.ep.id));
      if (added.length === 1) notify(d.id, d.title, `Novo episódio: T${added[0].si + 1}:E${added[0].ep.number} “${added[0].ep.title || 'Episódio ' + added[0].ep.number}”`, added[0].ep.id);
      else if (added.length > 1) notify(d.id, d.title, `${added.length} novos episódios disponíveis!`);
      S.items[S.items.findIndex(i => i.id === d.id)] = d;
    }
    draftOld.forEach(deleteMedia); draftOld = []; draftNew = []; draftSaved = true;
    await saveState(); toast('Salvo! ❤'); back();
  },
  migrateLocal() { migrateLocal(); },
  async logout() { if (!confirm('Sair da conta neste aparelho?')) return; const f = async () => { await sb.auth.signOut(); location.reload(); }; overlay ? closeOv(f) : f(); },
  async resetAll() {
    if (!confirm('Apagar TODOS os títulos, fotos, vídeos e perfis da nuvem?')) return;
    if (!confirm('Tem certeza absoluta? Some de todos os aparelhos e não dá para desfazer.')) return;
    loading(true, 'Apagando…'); try { await wipeCloud(); } catch (e) {} location.reload();
  },
  pTap(d, el, ev) {
    if (ev.target !== el) return; const ctl = document.getElementById('pctl'); ctl.classList.toggle('hid');
    clearTimeout(ctlTimer); const v = document.getElementById('pv'); if (v && !v.paused) ctlTimer = setTimeout(() => ctl.classList.add('hid'), 3200);
  },
  pPlay() { const v = document.getElementById('pv'); if (!v) return; v.paused ? v.play() : v.pause(); },
  pRw() { const v = document.getElementById('pv'); if (v) v.currentTime = Math.max(0, v.currentTime - 10); },
  pFf() { const v = document.getElementById('pv'); if (v) v.currentTime = Math.min(v.duration || 0, v.currentTime + 10); },
  pSwitch(d) { const f = () => go('player', { id: d.id, ep: d.ep }, true); overlay ? closeOv(f) : f(); },
  pEps(d) {
    const it = item(d.id); const t = stack[stack.length - 1]; const e = findEp(it, t.params.ep);
    const v = document.getElementById('pv'); if (v) v.pause();
    openOverlay(`<div class="sh-title"><h3>${esc(e.s.name)}</h3><button class="xbtn" data-a="closeOv">${I.x}</button></div>
      ${e.s.episodes.map(ep => `<button class="nitem" style="padding:8px 0" data-a="pSwitch" data-id="${it.id}" data-ep="${ep.id}">${wideImg(it, ep)}<span class="tx"><b>${esc(ep.number)}. ${esc(ep.title)}</b><small>${fmtDur(ep.duration)}</small></span>${ep.id === e.ep.id ? '<span class="dot"></span>' : ''}</button>`).join('')}`);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.a !== 'pTap') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind && draft) { let v = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.num !== undefined) v = Number(v) || 0; setPath(draft, t.dataset.bind, v); }
  if (t.id === 'q') { const top = stack[stack.length - 1]; top.params.q = t.value; document.getElementById('sres').innerHTML = searchResults(t.value); }
  if (t.dataset.set) { S.settings[t.dataset.set] = t.value; saveContentSoon(); }
  if (t.id === 'profName' && profDraft) profDraft.name = t.value;
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.bind && draft && t.type === 'checkbox') setPath(draft, t.dataset.bind, t.checked);
  if (t.dataset.media) onMediaFile(t);
  if (t.id === 'importFile' && t.files[0]) importBackup(t.files[0]);
  if (t.id === 'profPhoto' && t.files[0]) {
    const file = t.files[0]; t.value = '';
    const b = await cropImage(file, 1, 500, 'Enquadrar foto do perfil'); if (!b) return;
    loading(true, 'Enviando foto…');
    try {
      const id = await putMedia(b, 'Enviando foto…');
      if (profNewPhoto) deleteMedia(profNewPhoto); profNewPhoto = id; profDraft.photoId = id;
    } catch (err) { alert('Não foi possível enviar: ' + err.message); }
    loading(false); renderProfileSheet();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pinInput') A.pinOk(); });

/* =====================================================================
   Início
   ===================================================================== */
SCREENS.login = {
  html(p) {
    return `<div class="login"><div class="login-bg"></div><div class="login-box">
      <div style="display:flex;justify-content:center;margin-bottom:12px">${markHTML(84)}</div>
      <h1 style="text-align:center;margin-bottom:4px">${esc(brandTitle())}</h1>
      <p style="text-align:center;color:#bbb;margin:0 0 22px">Nosso cantinho de filmes e séries ❤</p>
      <form id="loginForm" autocomplete="on">
        <input class="inp" id="lgEmail" type="email" placeholder="E-mail" autocomplete="username" required>
        <input class="inp" id="lgPass" type="password" placeholder="Senha" autocomplete="current-password" required>
        <button class="btn" type="submit" id="lgBtn" style="background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff;font-size:17px;margin-top:6px;border-radius:28px">Abrir o nosso cantinho</button>
      </form>
      <p class="login-err" id="lgErr">${esc(p.err || '')}</p>
      <p class="login-hint">Acesso só para nós dois ❤</p>
      ${isStandalone() ? '' : `<button class="sbtn ghost full" data-a="install" style="margin-top:18px">${I.phone} Instalar o app na tela inicial</button>`}</div></div>`;
  }
};
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return; e.preventDefault();
  const btn = document.getElementById('lgBtn'), err = document.getElementById('lgErr');
  btn.disabled = true; btn.textContent = 'Entrando…'; err.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('lgEmail').value.trim(), password: document.getElementById('lgPass').value });
  if (error) { btn.disabled = false; btn.textContent = 'Abrir o nosso cantinho'; err.textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message; return; }
  boot();
});
function fatal(title, msg, retry) {
  app.innerHTML = `<div class="empty" style="margin-top:80px"><h3>${esc(title)}</h3><p style="white-space:pre-line">${msg}</p>${retry ? '<button class="sbtn red" onclick="location.reload()">Tentar de novo</button>' : ''}</div>`;
}
async function loadCloud() {
  const { data, error } = await sb.from('kv').select('key,value');
  if (error) throw error;
  const content = (data || []).find(r => r.key === 'content');
  if (content) Object.assign(S, content.value);
  S.settings = Object.assign({ brand: 'NOISFLIX', pin: '', heroId: '' }, S.settings || {});
  S.profiles = S.profiles || []; S.items = S.items || []; S.notifications = S.notifications || []; S.media = S.media || {};
  S.users = {}; (data || []).filter(r => r.key.startsWith('user:')).forEach(r => { S.users[r.key.slice(5)] = r.value; });
  if (!S.profiles.length) { S.profiles = [{ id: uid(), name: 'Ele', color: 'blue', photoId: '' }, { id: uid(), name: 'Ela', color: 'red', photoId: '' }]; await saveContent(); }
  await signAll();
}
async function boot() {
  loading(true, 'Carregando…');
  try { await loadCloud(); }
  catch (e) {
    loading(false);
    const m = e.message || String(e);
    if (/relation|does not exist|schema cache/i.test(m)) fatal('Banco ainda não configurado', 'Rode o arquivo supabase/setup.sql no SQL Editor do Supabase.\n\n' + esc(m), true);
    else fatal('Não foi possível carregar', esc(m), true);
    return;
  }
  loading(false);
  document.title = brandTitle();
  stack = [{ name: 'splash' }]; render();
  setTimeout(A.skipSplash, 2700);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
(async function init() {
  history.replaceState({ root: 1 }, '');
  if (!window.supabase) return fatal('Sem conexão', 'Não foi possível carregar o Supabase. Verifique a internet.', true);
  if (!configured) return fatal('Falta configurar o Supabase', 'Abra o index.html e preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do script.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { stack = [{ name: 'login', params: {} }]; render(); return; }
  boot();
})();
</script>
